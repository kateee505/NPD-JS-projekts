<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Velosipēdu noma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Velosipēdu noma</h1>

<p>Izvēlies velosipēda veidu un nomas dienu skaitu, lai aprēķinātu cenu.</p>

<div class="container">
    <label for="bikeType">Velosipēda veids:</label>
    <select id="bikeType">
        <option value="10">Pilsētas velo – 10€ / dienā</option>
        <option value="15">Kalnu velo – 15€ / dienā</option>
        <option value="20">Elektriskais velo – 20€ / dienā</option>
    </select>

    <label for="days">Nomas dienas:</label>
    <input type="number" id="days" placeholder="Ievadi dienu skaitu">

    <button id="rentBtn">Aprēķināt cenu</button>
</div>

<div id="result"></div>

<script src="script.js"></script>
</body>
</html>
